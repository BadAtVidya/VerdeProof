name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Setup Compact compiler
        run: |
          compact_archive="$RUNNER_TEMP/compact-0.5.0.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.0/compact-x86_64-unknown-linux-musl.tar.xz \
            --output "$compact_archive"
          mkdir -p "$HOME/.local/bin"
          tar -xJf "$compact_archive" --strip-components=1 -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact compile --version
      - run: npm ci
      - run: npm test

  app:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
