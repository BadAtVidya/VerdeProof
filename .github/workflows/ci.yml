name: CI

env:
  COMPACT_VERSION: 0.31.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract-compile:
    name: Compile Compact contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh \
            | sh -s -- --quiet
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update "$COMPACT_VERSION"
          "$HOME/.local/bin/compact" compile --version

      - name: Install dependencies
        run: npm ci

      - name: Compile contract
        run: npm run compact

      - name: Typecheck contract
        run: npm run typecheck

  frontend-typecheck:
    name: Typecheck frontend
    runs-on: ubuntu-latest
    needs: contract-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Compact compiler
        working-directory: contracts
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh \
            | sh -s -- --quiet
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update "$COMPACT_VERSION"

      - name: Install compiler dependencies
        working-directory: contracts
        run: npm ci

      - name: Generate contract artifacts
        working-directory: contracts
        run: npm run compact

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
